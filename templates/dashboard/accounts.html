{% extends 'base.html' %}
{% block content %}<h1>Pending account approvals</h1>{% for account in page_obj %}<article class="site-card mb-3"><h2 class="h4">{{ account.first_name }} {{ account.last_name }}</h2><p>{{ account.username }}</p><form method="post" action="{% url 'approve_account' account.pk %}">{% csrf_token %}<button class="btn btn-primary" type="submit">Approve camper</button></form></article>{% empty %}<p>No pending accounts.</p>{% endfor %}{% include 'pagination.html' %}{% endblock %}
