{% if page_obj.has_other_pages %}<nav aria-label="Pages" class="pagination-nav">
{% if page_obj.has_previous %}<a href="{% querystring page=page_obj.previous_page_number %}"><span aria-hidden="true">←</span> Previous</a>{% endif %}
<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next %}<a href="{% querystring page=page_obj.next_page_number %}">Next <span aria-hidden="true">→</span></a>{% endif %}</nav>{% endif %}
