{% extends 'base.html' %}
{% block content %}<h1>Notifications</h1>{% for item in page_obj %}<article class="site-card mb-3"><p>{{ item.message }}</p><time>{{ item.created_at }}</time>
{% if not item.read_at %}<form method="post" action="{% url 'notification_read' item.pk %}">{% csrf_token %}<button class="btn btn-outline-primary" type="submit">Mark as read</button></form>{% endif %}</article>{% empty %}<p>No notifications.</p>{% endfor %}{% include 'pagination.html' %}{% endblock %}
