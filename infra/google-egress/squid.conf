# SD-027: only the web peer can open end-to-end TLS tunnels to these two hosts.
http_port 172.30.20.2:3128
visible_hostname google-egress
acl web_peer src 172.30.20.3/32
acl CONNECT method CONNECT
acl TLS_port port 443
acl google_hosts dstdomain -n oauth2.googleapis.com www.googleapis.com
acl unsafe_destination dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
# Squid normalizes IPv4-mapped IPv6 addresses into the IPv4 ACL above.
acl unsafe_destination dst ::/96 fc00::/7 fe80::/10 fec0::/10 ff00::/8
acl too_many_connections maxconn 32
acl body_length req_header Content-Length .+
acl body_encoding req_header Transfer-Encoding .+
http_access deny !web_peer
http_access deny !CONNECT
http_access deny !TLS_port
http_access deny !google_hosts
http_access deny unsafe_destination
http_access deny too_many_connections
http_access deny body_length
http_access deny body_encoding
http_access allow web_peer CONNECT TLS_port google_hosts
http_access deny all
# No TLS decryption, credential logging, caching, peer proxy, or management interface.
cache deny all
cache_mem 0 MB
access_log none
cache_log /dev/null
cache_store_log none
logfile_rotate 0
pid_filename /run/squid/squid.pid
coredump_dir /run/squid
forwarded_for delete
connect_timeout 5 seconds
request_timeout 15 seconds
read_timeout 30 seconds
client_lifetime 1 minute
shutdown_lifetime 2 seconds
request_header_max_size 16 KB
