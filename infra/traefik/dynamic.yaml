http:
  routers:
    redirect:
      entryPoints: [web]
      rule: 'Host(`{{ env "APP_DOMAIN" }}`)'
      middlewares: [https-only]
      service: noop@internal
    campground:
      entryPoints: [websecure]
      rule: 'Host(`{{ env "APP_DOMAIN" }}`)'
      middlewares: [request-boundary, security-headers]
      service: campground
      tls:
        options: default
        {{ if eq (env "TLS_MODE") "acme" }}
        certResolver: public
        {{ end }}
  middlewares:
    https-only:
      redirectScheme:
        scheme: https
        port: '{{ env "HTTPS_PORT" }}'
        permanent: true
    request-boundary:
      buffering:
        maxRequestBodyBytes: 65536
        memRequestBodyBytes: 65536
    security-headers:
      headers:
        customRequestHeaders:
          Forwarded: ""
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: same-origin
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentSecurityPolicy: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
  services:
    campground:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://web:8000
tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
  {{ if eq (env "TLS_MODE") "development" }}
  certificates:
    - certFile: /run/secrets/dev_tls_cert
      keyFile: /run/secrets/dev_tls_key
  {{ end }}
